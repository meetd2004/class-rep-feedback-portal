{% extends "base.html" %}
{% block title %}Sign In · RepDesk{% endblock %}

{% block content %}
<section class="auth-center">
    <div class="card auth-card">
        <div class="auth-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>

        <div class="card-header">
            <span class="eyebrow">{{ cohort }}</span>
            <h1>Sign in to your account</h1>
            <p class="muted">
                Access your feedback submissions and class representative updates.
            </p>
        </div>

        {% if error_message %}
            <div class="alert alert-danger" role="alert">{{ error_message }}</div>
        {% endif %}

        <form action="{{ url_for('auth.login') }}" method="post" class="stack-form" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    value="{{ email_value }}"
                    autocomplete="username"
                    placeholder="name@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        data-toggle-password="password"
                        aria-label="Show password"
                    >
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>
    </div>
</section>
{% endblock %}
