{% extends "base.html" %}
{% block title %}Sign In · RepDesk{% endblock %}

{% block content %}
<section class="auth-center">
    <div class="card auth-card">
        <div class="card-header">
            <span class="eyebrow">{{ cohort }}</span>
            <h1>Sign in to your account</h1>
            <p class="muted">
                Access your feedback submissions and class representative updates.
            </p>
        </div>

        {% if error_message %}
            <div class="alert alert-danger" role="alert">{{ error_message }}</div>
        {% endif %}

        <form action="{{ url_for('auth.login') }}" method="post" class="stack-form" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    value="{{ email_value }}"
                    autocomplete="username"
                    placeholder="name@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>
    </div>
</section>
{% endblock %}
